packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/eslint/*'
  - 'packages/eslint-presets/*'
  - 'packages/prettier/*'

# eslint-plugin-react and eslint-plugin-jsx-a11y have no ESLint 10 release yet.
# eslint-plugin-react runs wrapped in @eslint/compat fixupConfigRules. Remove with devkit-91a.7.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-react>eslint: '10'
    eslint-plugin-jsx-a11y>eslint: '10'
